# Your app, wired to your practice API.
# Put HELPDESK_URL and HELPDESK_TOKEN in a .env file next to this one
# (copy them from your invitation page). Do not commit .env.
services:
  app:
    build: ./app
    ports:
      # Graded runs use the default 8080. Override HOST_APP_PORT locally
      # (e.g. in .env when another container already owns 8080).
      - "${HOST_APP_PORT:-8080}:8080"
    environment:
      HELPDESK_URL: ${HELPDESK_URL}
      HELPDESK_TOKEN: ${HELPDESK_TOKEN}
      PORT: "8080"
      DB_PATH: /app/data/db.sqlite
    volumes:
      # SQLite copy survives container rebuilds: no re-backfill on restart.
      - ./data:/app/data
